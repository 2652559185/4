      - name: Sync upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/chthollyphile/folia-major.git || true
          git fetch upstream

          git checkout main

          if ! git merge upstream/main --allow-unrelated-histories --no-edit; then
            echo "Merge conflict, keeping our deployment files..."

            git checkout --ours .github/workflows/sync-upstream.yml || true
            git add .github/workflows/sync-upstream.yml || true

            git checkout --ours vercel.json || true
            git add vercel.json || true

            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Unresolved conflicts:"
              git diff --name-only --diff-filter=U
              exit 1
            fi

            git commit -m "merge upstream (keep sync workflow and vercel.json)"
          fi

          git push origin main
