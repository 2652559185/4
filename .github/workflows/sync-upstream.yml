name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"  # 每天 UTC 0 点自动运行一次
  workflow_dispatch:      # 允许手动触发

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      # 步骤 1: 检出你的 Fork 仓库
      - name: Checkout target repo
        uses: actions/checkout@v4

      # 步骤 2: 前置检查，对比上游是否有更新
      - name: Check for upstream updates
        id: check_update
        run: |
          # 获取上游仓库的最新 commit hash
          UPSTREAM_HASH=$(git ls-remote https://github.com/chthollyphile/folia-major.git HEAD | awk '{ print $1 }')
          # 获取当前仓库的最新 commit hash
          LOCAL_HASH=$(git rev-parse HEAD)
          
          echo "上游最新 Commit: $UPSTREAM_HASH"
          echo "本地最新 Commit: $LOCAL_HASH"
          
          if [ "$UPSTREAM_HASH" = "$LOCAL_HASH" ]; then
            echo "没有检测到更新，跳过同步。"
            echo "has_update=false" >> $GITHUB_OUTPUT
          else
            echo "检测到上游有新提交，准备同步。"
            echo "has_update=true" >> $GITHUB_OUTPUT
          fi

      # 步骤 3: 如果检查发现有更新，才执行同步操作
      - name: Sync upstream changes
        if: steps.check_update.outputs.has_update == 'true'
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          upstream_sync_repo: chthollyphile/folia-major
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}

      # 步骤 4: 如果同步失败，输出提示信息
      - name: Sync check
        if: failure()
        run: |
          echo "[Error] 同步失败，可能是遇到冲突或权限问题，请检查日志或手动 Sync Fork。"
          exit 1
